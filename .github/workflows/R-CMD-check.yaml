name: R-CMD-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: ubuntu-release, os: ubuntu-latest, r: 'release'}
          - {name: ubuntu-devel, os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {name: ubuntu-oldrel-1, os: ubuntu-latest, r: 'oldrel-1'}
          - {name: macos-release, os: macos-latest, r: 'release'}
          - {name: windows-release, os: windows-latest, r: 'release'}

    env:
      R_KEEP_PKG_SOURCE: 'yes'
      READBOE_RUN_LIVE_TESTS: 'false'
      READBOE_RUN_BANKSTATS_LIVE_TESTS: 'false'
      TZ: 'UTC'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck

      - name: Run R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
